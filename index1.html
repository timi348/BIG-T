<!DOCTYPE html>
<html>
<head>
    <title>GameZone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎮 GameZone</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Games</a>
            <a href="#">Leaderboard</a>
            <a href="#">Login</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <h2>Welcome to GameZone</h2>
            <p>Play games, have fun and beat your high score!</p>
            <button>Start Playing</button>
        </section>

        <section>
            <h2>Popular Games</h2>

            <div class="games">

                <div class="game">
                    <h3>🎯 Number Guessing</h3>
                    <p>Guess the secret number.</p>
                    <button onclick="playGame()">Play</button>
                </div>

                <div class="game">
                    <h3>🧠 Quiz Game</h3>
                    <p>Test your knowledge.</p>
                    <button>Play</button>
                </div>

                <div class="game">
                    <h3>✂️ Rock Paper Scissors</h3>
                    <p>Challenge the computer.</p>
                    <button>Play</button>
                </div>

            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 GameZone</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
